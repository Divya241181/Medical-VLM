services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: medvlm-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.5-flash}
      - DATABASE_URL=sqlite:////app/data/medvlm.db
    volumes:
      - medvlm-db-data:/app/data
      - medvlm-torch-models:/root/.torchxrayvision

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: medvlm-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  medvlm-db-data:
  medvlm-torch-models:
